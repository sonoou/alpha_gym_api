# ==================================================
# APP & SERVER CONFIGURATION
# ==================================================
server.port=8080
spring.application.name=alpha-veins-backend

# ==================================================
# MYSQL DATABASE CONFIGURATION (Database: alpha)
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/alpha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=15061999
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# SPRING DATA JPA & HIBERNATE CONFIG
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ==================================================
# MULTIPART FILE UPLOAD CONFIG (Photos & 9:16 Videos)
# ==================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/

